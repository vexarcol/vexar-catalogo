*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f4f0;--sf:#fff;--bd:#e3e1da;--tx:#181816;--mu:#6a6860;--r:14px;--rs:9px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
.bar{height:5px;background:linear-gradient(90deg,#55CDFC 20%,#F7A8B8 20% 40%,#fff 40% 60%,#F7A8B8 60% 80%,#55CDFC 80%)}
.hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:28px 20px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 var(--bd)}
.logo{width:68px;height:68px;border-radius:50%;background:#181816;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:2px;margin-bottom:10px}
.hdr h1{font-size:24px;font-weight:700;margin-bottom:4px}
.hdr p{font-size:13px;color:var(--mu)}
.sw{max-width:420px;margin:14px auto 0;position:relative}
.sw svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.sw input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);font-size:14px;color:var(--tx);outline:none}
.sw input:focus{border-color:#999}
.main{max-width:980px;margin:0 auto;padding:24px 14px 56px}
.stats{padding:11px 16px;margin-bottom:18px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);font-size:13px;color:var(--mu)}
.stats strong{color:var(--tx)}
.cb{margin-bottom:14px}
.ch{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);transition:border-color .15s}
.ch:hover{border-color:#aaa}
.ch.open{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
.cp{display:flex;gap:4px;flex-shrink:0}
.cp img{width:44px;height:44px;border-radius:7px;object-fit:cover;border:1px solid var(--bd);background:var(--bg)}
.ct{flex:1;min-width:0}
.cn{font-size:16px;font-weight:600}
.cd{font-size:12px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{font-size:18px;color:var(--mu);transition:transform .2s;flex-shrink:0}
.ch.open .cv{transform:rotate(180deg)}
.body{display:none;border:1px solid var(--bd);border-top:none;border-radius:0 0 var(--r) var(--r);background:var(--sf);padding:18px}
.body.open{display:block}
.ss{margin-bottom:22px}
.ss:last-child{margin-bottom:0}
.sl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.sl a{font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--mu);text-decoration:none;border:1px solid var(--bd);border-radius:999px;padding:2px 9px}
.sl a:hover{border-color:#999;color:var(--tx)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.pc{border:1px solid var(--bd);border-radius:var(--rs);overflow:hidden;background:var(--bg);cursor:pointer;transition:border-color .15s,transform .12s}
.pc:hover{border-color:#999;transform:translateY(-2px)}
.pc.hid{display:none}
.iw{width:100%;aspect-ratio:1;overflow:hidden;background:#e8e6e2;position:relative}
.iw img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.pc:hover .iw img{transform:scale(1.05)}
.ni{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#ccc}
.pi{padding:8px 10px 10px}
.pn{font-size:11px;font-weight:500;line-height:1.4;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pf{font-size:10px;color:var(--mu);margin-top:2px}
#nr{display:none;text-align:center;padding:44px 20px;color:var(--mu);font-size:14px}
.lb{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.84);align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lbx{background:var(--sf);border-radius:16px;max-width:500px;width:100%;overflow:hidden;position:relative}
.lbi{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#efeded}
.lbn{padding:14px 18px 18px}
.lbn strong{font-size:15px;font-weight:600;display:block;margin-bottom:3px}
.lbn span{font-size:12px;color:var(--mu)}
.lbc{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.np{left:8px}.nn{right:8px}
footer{text-align:center;padding:18px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);margin-top:28px}
</style>

let cards=[],imgs=[],idx=0;
function build(){
  const w=document.getElementById('cat');
  D.forEach((cat,ci)=>{
    const b=document.createElement('div');b.className='cb';
    const allImgs=cat.subcats.flatMap(s=>s.products.flatMap(p=>p.imgs));
    const prev=allImgs.slice(0,3).map(s=>`<img src="${s}" loading="lazy" onerror="this.style.opacity=0">`).join('')||'<img style="opacity:0">';
    b.innerHTML=`<div class="ch" onclick="tog(this)"><div class="cp">${prev}</div><div class="ct"><div class="cn">${cat.emoji} ${cat.name}</div><div class="cd">${cat.desc}</div></div><span class="cv">▾</span></div><div class="body"></div>`;
    w.appendChild(b);
    fill(b.querySelector('.body'),cat);
  });
  document.getElementById('st').innerHTML=`<strong>${D.reduce((a,c)=>a+c.subcats.reduce((b,s)=>b+s.products.length,0),0)}</strong> productos en el catálogo &nbsp;·&nbsp; <span>Haz clic en una categoría para ver</span>`;
}
function tog(h){
  const b=h.nextElementSibling,open=b.classList.toggle('open');
  h.classList.toggle('open',open);
}
function fill(body,cat){
  cat.subcats.forEach(sub=>{
    if(!sub.products.length)return;
    const s=document.createElement('div');s.className='ss';
    s.innerHTML=`<div class="sl">${sub.label} <span style="font-weight:400;opacity:.6">(${sub.products.length})</span></div>`;
    const g=document.createElement('div');g.className='pg';
    sub.products.forEach(p=>{
      const c=document.createElement('div');c.className='pc';
      c.dataset.n=p.name.toLowerCase();c.dataset.c=cat.name.toLowerCase();
      c.onclick=()=>ol(p.imgs,0,p.name,cat.name+' · '+sub.label);
      c.innerHTML=`<div class="iw"><img src="${p.imgs[0]}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="ni" style="display:none">📷</div></div><div class="pi"><div class="pn">${p.name}</div>${p.imgs.length>1?`<div class="pf">${p.imgs.length} fotos</div>`:''}</div>`;
      cards.push({el:c,n:p.name.toLowerCase(),c:cat.name.toLowerCase(),block:body.parentElement});
      g.appendChild(c);
    });
    s.appendChild(g);body.appendChild(s);
  });
}
function ol(i,x,n,s){imgs=i;idx=x;document.getElementById('li').src=i[x];document.getElementById('ln').textContent=n;document.getElementById('ls').textContent=s+(i.length>1?` · Foto ${x+1} de ${i.length}`:'');document.getElementById('lb').classList.add('open');}
function ns(d){idx=(idx+d+imgs.length)%imgs.length;document.getElementById('li').src=imgs[idx];const s=document.getElementById('ls');s.textContent=s.textContent.replace(/· Foto \d+ de \d+/,`· Foto ${idx+1} de ${imgs.length}`);}
function cl(){document.getElementById('lb').classList.remove('open');}
function bgc(e){if(e.target===document.getElementById('lb'))cl();}
document.addEventListener('keydown',e=>{if(!document.getElementById('lb').classList.contains('open'))return;if(e.key==='Escape')cl();if(e.key==='ArrowRight')ns(1);if(e.key==='ArrowLeft')ns(-1);});
function filter(q){
  q=q.toLowerCase().trim();
  let v=0;
  const openBlocks=new Set();
  cards.forEach(({el,n,c,block})=>{
    const m=!q||n.includes(q)||c.includes(q);
    el.classList.toggle('hid',!m);
    if(m){v++;if(q)openBlocks.add(block);}
  });
  document.querySelectorAll('.cb').forEach(b=>{
    const h=b.querySelector('.ch'),body=b.querySelector('.body');
    if(q){
      const show=openBlocks.has(b);
      b.style.display=show?'':'none';
      body.classList.add('open');h.classList.add('open');
    }else{
      b.style.display='';
      body.classList.remove('open');h.classList.remove('open');
    }
  });
  document.getElementById('nr').style.display=(!q||v>0)?'none':'block';
  document.getElementById('qd').textContent=q;
}
build();
