<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Vexar – Catálogo de productos para homens trans e LGBT+">
<meta property="og:title" content="Vexar – Catálogo">
<meta property="og:description" content="Packers, Binders, Cuecas, Cintas y más.">
<title>Vexar – Catálogo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;
  --surface:#ffffff;
  --border:#e3e1da;
  --text:#181816;
  --muted:#6a6860;
  --accent:#181816;
  --radius:14px;
  --rsm:9px;
  --trans-flag-blue:#55CDFC;
  --trans-flag-pink:#F7A8B8;
  --trans-flag-white:#FFFFFF;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Top bar ── */
.topbar{
  height:5px;
  background:linear-gradient(90deg,
    var(--trans-flag-blue) 0%,var(--trans-flag-blue) 20%,
    var(--trans-flag-pink) 20%,var(--trans-flag-pink) 40%,
    var(--trans-flag-white) 40%,var(--trans-flag-white) 60%,
    var(--trans-flag-pink) 60%,var(--trans-flag-pink) 80%,
    var(--trans-flag-blue) 80%,var(--trans-flag-blue) 100%);
}

/* ── Header ── */
.header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:32px 24px 24px;
  text-align:center;
}
.logo{
  width:72px;height:72px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:600;letter-spacing:2px;
  margin-bottom:12px;
}
.header h1{font-size:26px;font-weight:600;margin-bottom:6px}
.header p{font-size:14px;color:var(--muted)}

/* ── Search ── */
.search-wrap{max-width:440px;margin:18px auto 0;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{
  width:100%;padding:11px 16px 11px 42px;
  border:1px solid var(--border);border-radius:999px;
  background:var(--bg);font-size:14px;color:var(--text);outline:none;
  transition:border-color .15s;
}
.search-wrap input:focus{border-color:#aaa}

/* ── Main ── */
.main{max-width:1000px;margin:0 auto;padding:28px 16px 60px}

/* ── Stats ── */
.stats{
  display:flex;gap:24px;flex-wrap:wrap;
  padding:12px 18px;margin-bottom:22px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);font-size:13px;color:var(--muted);
  align-items:center;
}
.stats strong{color:var(--text);font-weight:600}

/* ── Category block ── */
.cat-block{margin-bottom:16px}
.cat-header{
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;cursor:pointer;user-select:none;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);transition:border-color .15s;
}
.cat-header:hover{border-color:#bbb}
.cat-header.open{border-radius:var(--radius) var(--radius) 0 0;border-bottom-color:transparent}
.cat-preview{display:flex;gap:5px;flex-shrink:0}
.cat-preview img{
  width:46px;height:46px;border-radius:7px;
  object-fit:cover;border:1px solid var(--border);
  background:var(--bg);
}
.cat-text{flex:1;min-width:0}
.cat-name{font-size:17px;font-weight:600}
.cat-desc{font-size:12px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-chevron{font-size:20px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.cat-header.open .cat-chevron{transform:rotate(180deg)}

/* ── Body ── */
.cat-body{
  display:none;
  border:1px solid var(--border);border-top:none;
  border-radius:0 0 var(--radius) var(--radius);
  background:var(--surface);padding:20px;
}
.cat-body.open{display:block}

/* ── Subcat section ── */
.sub-section{margin-bottom:24px}
.sub-section:last-child{margin-bottom:0}
.sub-label{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted);
  margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.sub-link{
  font-size:11px;font-weight:400;text-transform:none;
  letter-spacing:0;color:var(--muted);
  text-decoration:none;
  border:1px solid var(--border);border-radius:999px;
  padding:3px 10px;transition:border-color .15s;
}
.sub-link:hover{border-color:#999;color:var(--text)}

/* ── Product grid ── */
.prod-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:10px;
}
.prod-card{
  border:1px solid var(--border);border-radius:var(--rsm);
  overflow:hidden;background:var(--bg);cursor:pointer;
  transition:border-color .15s,transform .15s;
}
.prod-card:hover{border-color:#999;transform:translateY(-2px)}
.prod-card.hidden{display:none}
.img-wrap{width:100%;aspect-ratio:1;overflow:hidden;background:#e8e6e2;position:relative}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.prod-card:hover .img-wrap img{transform:scale(1.05)}
.no-img{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  color:#bbb;font-size:13px;
}
.no-img svg{opacity:.4}
.prod-info{padding:9px 11px 11px}
.prod-name{
  font-size:12px;font-weight:500;line-height:1.4;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.prod-count{font-size:11px;color:var(--muted);margin-top:3px}

/* ── Empty ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.8}
.empty code{font-size:12px;background:var(--bg);padding:3px 8px;border-radius:5px}

/* ── Lightbox ── */
.lb{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.82);
  align-items:center;justify-content:center;padding:20px;
}
.lb.open{display:flex}
.lb-box{
  background:var(--surface);border-radius:18px;
  max-width:520px;width:100%;overflow:hidden;
  position:relative;
}
.lb-img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#efefed}
.lb-info{padding:16px 20px 20px}
.lb-name{font-size:16px;font-weight:600;margin-bottom:4px}
.lb-sub{font-size:13px;color:var(--muted)}
.lb-close{
  position:absolute;top:12px;right:12px;
  background:rgba(0,0,0,.5);color:#fff;border:none;
  border-radius:50%;width:32px;height:32px;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.45);color:#fff;border:none;
  border-radius:50%;width:36px;height:36px;font-size:20px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.lb-prev{left:10px}.lb-next{right:10px}

/* ── No results ── */
#no-results{display:none;text-align:center;padding:48px 20px;color:var(--muted);font-size:15px}

/* ── Footer ── */
.footer{
  text-align:center;padding:20px;font-size:12px;color:var(--muted);
  border-top:1px solid var(--border);margin-top:32px;
}
</style>
</head>
<body>

<div class="topbar"></div>

<div class="header">
  <div class="logo">VX</div>
  <h1>Vexar</h1>
  <p>Catálogo de productos · Moda e acessórios trans e LGBT+</p>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Buscar producto..." autocomplete="off" oninput="filterProducts(this.value)">
  </div>
</div>

<div class="main">
  <div class="stats" id="stats">
    <span>Cargando catálogo...</span>
  </div>
  <div id="catalog"></div>
  <div id="no-results">No se encontraron productos para "<span id="q-display"></span>"</div>
</div>

<div class="footer">
  Vexar &nbsp;·&nbsp; Catálogo de produtos trans e LGBT+
</div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="lbBgClick(event)">
  <div class="lb-box">
    <button class="lb-close" onclick="closeLb()" aria-label="Cerrar">✕</button>
    <button class="lb-prev lb-nav" onclick="lbStep(-1)" aria-label="Anterior">‹</button>
    <button class="lb-next lb-nav" onclick="lbStep(1)"  aria-label="Siguiente">›</button>
    <img id="lb-img" class="lb-img" src="" alt="">
    <div class="lb-info">
      <div class="lb-name" id="lb-name"></div>
      <div class="lb-sub"  id="lb-sub"></div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// CATÁLOGO DE DATOS
// Las imágenes se cargan desde las subcarpetas relativas al index.html
// Estructura esperada (misma que generaron los scripts de descarga):
//
//   index.html
//   Packers/
//     Packers_5em1/   ← imágenes .webp/.jpg
//     Packers_2em1/
//     ...
//   Binders/
//   Cuecas/
//   Cintas/
//   Outros/
//   Kits_Promocionais/
//
// ─────────────────────────────────────────────────────────────
const CATALOG = [
  {
    id:"packers", name:"Packers", emoji:"📦",
    desc:"5em1 · 2em1 · Volume · Função Sexo · Extensores · Vértebras",
    subcats:[
      {label:"Packers 5em1",      folder:"Packers/Packers_5em1",      url:"https://www.transtore.com.br/packers/packers-5em1/"},
      {label:"Packers 2em1",      folder:"Packers/Packers_2em1",      url:"https://www.transtore.com.br/packers/packers-2em1/"},
      {label:"Packers de volume", folder:"Packers/Packers_de_volume",  url:"https://www.transtore.com.br/packers/packers-de-volume/"},
      {label:"Função Sexo",       folder:"Packers/Funcao_Sexo",        url:"https://www.transtore.com.br/packers/packers-funcao-sexo/"},
      {label:"Extensores",        folder:"Packers/Extensores",         url:"https://www.transtore.com.br/packers/packers-extensores/"},
      {label:"Vértebras",         folder:"Packers/Vertebras",          url:"https://www.transtore.com.br/packers/vertebras/"},
    ]
  },
  {
    id:"binders", name:"Binders", emoji:"🩹",
    desc:"Faixa · Com Alça · Tape Binder Adesivo",
    subcats:[
      {label:"Binder Faixa",        folder:"Binders/Binder_Faixa",        url:"https://www.transtore.com.br/binders/binder-faixa/"},
      {label:"Binders com Alça",    folder:"Binders/Binders_com_Alca",    url:"https://www.transtore.com.br/binders/binders-com-alca/"},
      {label:"Tape Binder Adesivo", folder:"Binders/Tape_Binder_Adesivo", url:"https://www.transtore.com.br/binders/tape-binder-adesivo/"},
    ]
  },
  {
    id:"cuecas", name:"Cuecas", emoji:"👙",
    desc:"2 funções · 3 funções · Bolsinho · Absorvente · Volume · Sunga",
    subcats:[
      {label:"Cuecas 2 funções",   folder:"Cuecas/Cuecas_2_funcoes",   url:"https://www.transtore.com.br/cuecas/cuecas-2-funcoes/"},
      {label:"Cuecas 3 funções",   folder:"Cuecas/Cuecas_3_funcoes",   url:"https://www.transtore.com.br/cuecas/cuecas-3-funcoes/"},
      {label:"Cueca com bolsinho", folder:"Cuecas/Cueca_com_bolsinho", url:"https://www.transtore.com.br/cuecas/cueca-com-bolsinho/"},
      {label:"Cueca absorvente",   folder:"Cuecas/Cueca_absorvente",   url:"https://www.transtore.com.br/cuecas/cueca-absorvente/"},
      {label:"Cueca com volume",   folder:"Cuecas/Cueca_com_volume",   url:"https://www.transtore.com.br/cuecas/cueca-com-volume/"},
      {label:"Sunga",              folder:"Cuecas/Sunga",              url:"https://www.transtore.com.br/cuecas/sunga/"},
    ]
  },
  {
    id:"cintas", name:"Cintas", emoji:"🔗",
    desc:"Para sexo · Para dia a dia",
    subcats:[
      {label:"Cinta para sexo",      folder:"Cintas/Cinta_para_sexo",      url:"https://www.transtore.com.br/cintas/cinta-para-sexo/"},
      {label:"Cinta para dia a dia", folder:"Cintas/Cinta_para_dia_a_dia", url:"https://www.transtore.com.br/cintas/cinta-para-dia-a-dia/"},
    ]
  },
  {
    id:"outros", name:"Outros", emoji:"🎁",
    desc:"Cosméticos · Masturbadores · Acessórios · Bandeiras · Calcinha · Presentes",
    subcats:[
      {label:"Cosméticos",          folder:"Outros/Cosmeticos",          url:"https://www.transtore.com.br/outros/cosmeticos/"},
      {label:"Masturbadores",       folder:"Outros/Masturbadores",       url:"https://www.transtore.com.br/outros/masturbadores1/"},
      {label:"Acessórios",          folder:"Outros/Acessorios",          url:"https://www.transtore.com.br/outros/acessorios1/"},
      {label:"Bandeiras e Toalhas", folder:"Outros/Bandeiras_e_Toalhas", url:"https://www.transtore.com.br/outros/bandeiras-e-toalhas/"},
      {label:"Calcinha Aquendar",   folder:"Outros/Calcinha_Aquendar",   url:"https://www.transtore.com.br/outros/calcinha-de-aquendar/"},
      {label:"Presentes",           folder:"Outros/Presentes",           url:"https://www.transtore.com.br/outros/presentes/"},
    ]
  },
  {
    id:"kits", name:"Kits Promocionais", emoji:"🛍️",
    desc:"Combos e packs especiais",
    subcats:[
      {label:"Kits Promocionais", folder:"Kits_Promocionais/Kits_Promocionais", url:"https://www.transtore.com.br/kits/"},
    ]
  },
];

// ─────────────────────────────────────────────────────────────
// LEER IMÁGENES: escanea el listado de directorio del servidor
// En Netlify los directorios devuelven un JSON o HTML con los archivos.
// ─────────────────────────────────────────────────────────────
const IMG_EXTS = new Set(["webp","jpg","jpeg","png","gif"]);
const imgCache = {};

async function listFolder(folder) {
  if (imgCache[folder]) return imgCache[folder];
  const url = folder.endsWith("/") ? folder : folder + "/";
  try {
    const r = await fetch(url);
    if (!r.ok) { imgCache[folder]=[]; return []; }
    const text = await r.text();
    const files = [];
    // Parsear listado HTML de Netlify / directorio estático
    const parser = new DOMParser();
    const doc = parser.parseFromString(text,"text/html");
    doc.querySelectorAll("a[href]").forEach(a => {
      const href = decodeURIComponent(a.getAttribute("href"));
      const fname = href.split("/").pop().split("?")[0];
      if (!fname) return;
      const ext = fname.split(".").pop().toLowerCase();
      if (IMG_EXTS.has(ext) && !fname.startsWith(".")) files.push(fname);
    });
    imgCache[folder] = files;
    return files;
  } catch { imgCache[folder]=[]; return []; }
}

// Nombre legible desde filename
function nameFromFile(f) {
  return f.replace(/\.[^.]+$/,"").replace(/_\d{2}$/,"").replace(/_/g," ").trim();
}

// Agrupar por producto (mismo nombre base sin _NN)
function groupByProduct(files) {
  const map = {};
  files.sort().forEach(f => {
    const base = f.replace(/\.[^.]+$/,"").replace(/_\d{2}$/,"");
    if (!map[base]) map[base] = [];
    map[base].push(f);
  });
  return Object.entries(map);
}

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
let allCards = []; // {el, name, cat}
let lbImages = []; // URLs activas en lightbox
let lbIdx = 0;

function buildCatalog() {
  const wrap = document.getElementById("catalog");
  CATALOG.forEach(cat => {
    const block = document.createElement("div");
    block.className = "cat-block";

    // Header con miniaturas placeholder (se llenan al abrir)
    const hdr = document.createElement("div");
    hdr.className = "cat-header";
    hdr.innerHTML = `
      <div class="cat-preview" id="prev-${cat.id}">
        <img src="" alt="" style="opacity:0" width="46" height="46">
        <img src="" alt="" style="opacity:0" width="46" height="46">
        <img src="" alt="" style="opacity:0" width="46" height="46">
      </div>
      <div class="cat-text">
        <div class="cat-name">${cat.emoji} ${cat.name}</div>
        <div class="cat-desc">${cat.desc}</div>
      </div>
      <span class="cat-chevron">▾</span>`;
    hdr.onclick = () => toggleCat(block, cat);
    block.appendChild(hdr);

    const body = document.createElement("div");
    body.className = "cat-body";
    body.dataset.loaded = "false";
    block.appendChild(body);

    wrap.appendChild(block);
  });
}

function toggleCat(block, cat) {
  const hdr  = block.querySelector(".cat-header");
  const body = block.querySelector(".cat-body");
  const open = body.classList.toggle("open");
  hdr.classList.toggle("open", open);
  if (open && body.dataset.loaded === "false") {
    body.dataset.loaded = "true";
    loadCat(body, cat, block);
  }
}

async function loadCat(body, cat, block) {
  body.innerHTML = `<div class="empty">Cargando imágenes...</div>`;
  let catTotal = 0;
  const sections = [];

  for (const sub of cat.subcats) {
    const files = await listFolder(sub.folder);
    catTotal += groupByProduct(files).length;
    sections.push({sub, files});
  }

  if (catTotal === 0) {
    body.innerHTML = `<div class="empty">
      No se encontraron imágenes en esta categoría.<br>
      <small>Asegúrate de haber copiado las carpetas junto al <code>index.html</code></small>
    </div>`;
    return;
  }

  body.innerHTML = "";
  const previewEl = block.querySelector(`#prev-${cat.id}`);
  let previewCount = 0;

  for (const {sub, files} of sections) {
    const products = groupByProduct(files);
    if (!products.length) continue;

    const sec = document.createElement("div");
    sec.className = "sub-section";
    sec.innerHTML = `<div class="sub-label">
      ${sub.label} <span style="font-weight:400;opacity:.6">(${products.length} productos)</span>
      <a class="sub-link" href="${sub.url}" target="_blank" rel="noopener">Ver en tienda ↗</a>
    </div>`;

    const grid = document.createElement("div");
    grid.className = "prod-grid";

    products.forEach(([base, imgs]) => {
      const first = `${sub.folder}/${imgs[0]}`;
      const name  = nameFromFile(imgs[0]);
      const allImgPaths = imgs.map(f => `${sub.folder}/${f}`);

      // Preview del header de categoría (máx 3)
      if (previewCount < 3 && previewEl) {
        const pi = previewEl.children[previewCount];
        if (pi) { pi.src = first; pi.alt = name; pi.style.opacity = "1"; }
        previewCount++;
      }

      const card = document.createElement("div");
      card.className = "prod-card";
      card.dataset.name = name.toLowerCase();
      card.dataset.cat  = cat.name.toLowerCase();
      card.onclick = () => openLb(allImgPaths, 0, name, `${cat.name} · ${sub.label}`);

      card.innerHTML = `
        <div class="img-wrap">
          <img src="${first}" alt="${name}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="no-img" style="display:none">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Sin foto
          </div>
        </div>
        <div class="prod-info">
          <div class="prod-name">${name}</div>
          ${imgs.length>1?`<div class="prod-count">${imgs.length} fotos</div>`:""}
        </div>`;

      allCards.push({el:card, name:name.toLowerCase(), cat:cat.name.toLowerCase()});
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    body.appendChild(sec);
  }
  updateStats();
}

// ─────────────────────────────────────────────────────────────
// LIGHTBOX con navegación entre fotos del producto
// ─────────────────────────────────────────────────────────────
function openLb(imgs, idx, name, sub) {
  lbImages = imgs; lbIdx = idx;
  document.getElementById("lb-img").src  = imgs[idx];
  document.getElementById("lb-name").textContent = name;
  document.getElementById("lb-sub").textContent  = sub + (imgs.length>1 ? ` · Foto ${idx+1}/${imgs.length}` : "");
  document.getElementById("lb").classList.add("open");
}
function lbStep(d) {
  lbIdx = (lbIdx + d + lbImages.length) % lbImages.length;
  document.getElementById("lb-img").src = lbImages[lbIdx];
  document.getElementById("lb-sub").textContent = document.getElementById("lb-sub")
    .textContent.replace(/· Foto \d+\/\d+/,`· Foto ${lbIdx+1}/${lbImages.length}`);
}
function closeLb() { document.getElementById("lb").classList.remove("open"); }
function lbBgClick(e) { if(e.target===document.getElementById("lb")) closeLb(); }
document.addEventListener("keydown", e => {
  if (!document.getElementById("lb").classList.contains("open")) return;
  if (e.key==="Escape") closeLb();
  if (e.key==="ArrowRight") lbStep(1);
  if (e.key==="ArrowLeft")  lbStep(-1);
});

// ─────────────────────────────────────────────────────────────
// BÚSQUEDA
// ─────────────────────────────────────────────────────────────
function filterProducts(q) {
  q = q.toLowerCase().trim();
  let visible = 0;
  allCards.forEach(({el, name, cat}) => {
    const match = !q || name.includes(q) || cat.includes(q);
    el.classList.toggle("hidden", !match);
    if (match) visible++;
  });
  document.getElementById("no-results").style.display = (!q||visible>0) ? "none" : "block";
  document.getElementById("q-display").textContent = q;
}

// ─────────────────────────────────────────────────────────────
// STATS
// ─────────────────────────────────────────────────────────────
function updateStats() {
  const total = document.querySelectorAll(".prod-card").length;
  document.getElementById("stats").innerHTML = `
    <strong>${total}</strong> productos cargados &nbsp;·&nbsp;

}

buildCatalog();
</script>
